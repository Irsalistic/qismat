[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prize-bond-checker"
version = "1.1.0"
description = "AI-ready CLI to check Pakistani prize bonds against draw results from allprizebond.pk"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Irsalistic" }]
keywords = ["pakistan", "prize-bond", "national-savings", "cli", "ai", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
prize-bond-checker = "prize_bond_checker.cli:main"

[project.urls]
Homepage = "https://github.com/Irsalistic/prize-bond-checker"
Repository = "https://github.com/Irsalistic/prize-bond-checker"
Issues = "https://github.com/Irsalistic/prize-bond-checker/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
