[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qismat"
version = "1.4.0"
description = "Qismat — never miss a Pakistani prize-bond draw. Local dashboard, voice add, alerts, and MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Irsalistic" }]
keywords = ["pakistan", "prize-bond", "national-savings", "cli", "ai", "ollama", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
mcp = ["mcp>=2.0"]

[project.scripts]
qismat = "qismat.cli:main"
qismat-mcp = "qismat.mcp_server:main"
prize-bond-checker = "qismat.cli:main"

[project.urls]
Homepage = "https://github.com/Irsalistic/qismat"
Repository = "https://github.com/Irsalistic/qismat"
Issues = "https://github.com/Irsalistic/qismat/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qismat = ["web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
